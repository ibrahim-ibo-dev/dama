name: Native mobile

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'lib/game.ts'
      - 'lib/bot.ts'
      - 'tests/game.test.ts'
      - 'tests/bot.test.ts'
      - 'scripts/generate-mobile-fixtures.ts'
      - '.github/workflows/mobile.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - 'lib/game.ts'
      - 'lib/bot.ts'
      - 'tests/game.test.ts'
      - 'tests/bot.test.ts'
      - 'scripts/generate-mobile-fixtures.ts'
      - '.github/workflows/mobile.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.0'
  DAMA_SERVER_URL: 'https://dama.ibrahim-eng.dev'

defaults:
  run:
    working-directory: mobile
    shell: bash

jobs:
  android:
    name: Analyze, test and Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show toolchain
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze native app
        run: flutter analyze

      - name: Run native tests
        run: flutter test

      - name: Build development APK
        run: flutter build apk --debug --dart-define=DAMA_SERVER_URL="$DAMA_SERVER_URL"

      - name: Upload Android development artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dama-android-debug
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  ios-simulator:
    name: Unsigned iOS simulator app
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          xcodebuild -version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build simulator app without signing
        run: flutter build ios --simulator --debug --no-codesign --dart-define=DAMA_SERVER_URL="$DAMA_SERVER_URL"

      - name: Package simulator app with preserved metadata
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/Dama-iOS-Simulator.zip

      - name: Upload simulator-only artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dama-ios-simulator
          path: mobile/build/ios/Dama-iOS-Simulator.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
